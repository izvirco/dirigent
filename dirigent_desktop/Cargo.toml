[package]
name = "dirigent_desktop"
version.workspace = true
edition.workspace = true

[dependencies]
dirigent_protocol.workspace = true
dirigent_service = { path = "../dirigent_service" }
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
# font-kit: macOS's text system (without it gpui_macos draws no text); the others, Linux's.
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = [
  "font-kit",
  "wayland",
  "x11",
] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
base64 = "0.22"
unicode-segmentation = "1"
toml = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
] }
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v7"] }
ureq.workspace = true
semver.workspace = true
minisign-verify = "0.3"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = [
  "svg",
  "system-fonts",
] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
parley = { version = "0.12", default-features = false }

[build-dependencies]
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
embed-resource = "3"
