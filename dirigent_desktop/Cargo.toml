[package]
name = "dirigent_desktop"
version.workspace = true
edition.workspace = true

[dependencies]
dirigent_protocol.workspace = true
dirigent_service = { path = "../dirigent_service" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = [
  "wayland",
  "x11",
] }
tokio-tungstenite = "0.28"
futures = "0.3"
base64 = "0.22"
unicode-segmentation = "1"
toml = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
# Image headers for inline image sizes, and shrinking pasted images (`images.rs`). The same
# crate gpui decodes with, so no extra build.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
] }
chrono = "0.4"
# A new thread's id, picked here so its draft can open it before the host replies.
uuid = { version = "1", features = ["v7"] }
