# Dirigent theme "vir-soft-dark", after vir's house look: super-dark grey surfaces, navy where
# things light up (hover, menus, send, running work), a coral accent. Copy to
# ~/.config/dirigent/theme/<name>.toml to make your own; config.toml's `theme = "<name>"` picks it.
# Colours are #rrggbb, or #rrggbbaa for a translucent one.

# Surfaces, from the window canvas (behind the sidebar) to the main panel, raised
# cards and inputs, hover fills, and the two line weights.
canvas = "#0e0f12"
panel = "#161719"
raised = "#1b1d23"
hover = "#1b2130"
# Menus, toasts and hover cards: they float over everything, so keep them solid.
popup = "#1b2130"
line = "#333a4b"
line_soft = "#23262c"
# The background pattern's ink (config.toml's `[background]`): its alpha is how strongly it shows.
pattern = "#333a4b4d"

# Text: primary, secondary, tertiary.
fg = "#cbcdd2"
fg_1 = "#9a9fab"
fg_2 = "#646a77"

# The one accent, spent on live things: a fill (send button, running), a brighter fill
# for the selected menu row, a line for focus rings, and a tint that reads as text.
# Vir's coral is too bright to fill under light text, so fills are its navy and the coral
# is the line and the tint.
accent = "#263556"
accent_active = "#2e4068"
accent_line = "#f47c63"
accent_ink = "#f88f78"
selection = "#6f8fd455"
bubble = "#1f2a44"
# The composer's glow: three rings fading out from it, the first in this colour (its alpha
# the glow's strength).
glow = "#1f2a44"

# The stop button: fill, hover fill, icon.
danger = "#4a1a24"
danger_active = "#5e2230"
danger_ink = "#f2a0ad"

# Status: working dot and the Workpool in blue, done check, errors, snoozed / pinned amber. Errors lean crimson to
# stay apart from the coral.
working = "#6f8fd4"
done = "#5fbf7a"
error = "#e0465f"
warn = "#e9c15a"
