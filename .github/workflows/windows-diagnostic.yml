name: Windows diagnostic build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LILEX_VERSION: "2.700"
  LILEX_SHA256: "34310edb4ba749f772d42b88e3eec4a6318527e75ceeaa96cfc556ee35366fbc"

jobs:
  build-windows-diagnostic:
    name: Build symbolized Windows diagnostic executable
    runs-on: blacksmith-2vcpu-windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create build name
        shell: pwsh
        run: |
          $timestamp = [DateTime]::UtcNow.ToString("yyyyMMdd_HHmm", [Globalization.CultureInfo]::InvariantCulture)
          $shortCommit = "${{ github.sha }}".Substring(0, 8)
          $buildName = "dirigent-diagnostic_${shortCommit}_${timestamp}"
          "DIRIGENT_BUILD_NAME=$buildName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building $buildName (UTC)"

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: useblacksmith/rust-cache@v3

      - name: Download Lilex
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "Lilex.zip"
          $destination = Join-Path $env:RUNNER_TEMP "Lilex"
          $url = "https://github.com/mishamyrt/Lilex/releases/download/$env:LILEX_VERSION/Lilex.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LILEX_SHA256) {
            throw "Lilex archive checksum mismatch: expected $env:LILEX_SHA256, got $actualHash"
          }

          Expand-Archive -Path $archive -DestinationPath $destination -Force
          "LILEX_FONT_DIR=$(Join-Path $destination 'ttf')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build optimized executable with symbols and frame pointers
        shell: pwsh
        env:
          RUSTFLAGS: "-C force-frame-pointers=yes"
        run: cargo build --locked --profile diagnostic --features bundled-lilex

      - name: Prepare diagnostic kit
        shell: pwsh
        run: |
          $dist = Join-Path "dist" $env:DIRIGENT_BUILD_NAME
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item target/diagnostic/dirigent.exe (Join-Path $dist "dirigent-diagnostic.exe")
          Copy-Item target/diagnostic/dirigent.pdb (Join-Path $dist "dirigent-diagnostic.pdb")
          Copy-Item scripts/windows/start-diagnostics.ps1 $dist
          Copy-Item scripts/windows/start-diagnostics.cmd $dist
          Copy-Item licenses/Lilex-OFL.txt $dist

          $executable = Join-Path $dist "dirigent-diagnostic.exe"
          $checksum = (Get-FileHash -Path $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  dirigent-diagnostic.exe" | Set-Content -Path (Join-Path $dist "dirigent-diagnostic.exe.sha256") -Encoding ascii
          @"
          Dirigent Windows hang diagnostic kit

          1. Extract the entire artifact ZIP.
          2. Double-click start-diagnostics.cmd.
          3. Use Dirigent normally. A message will appear after a freeze is captured.
          4. Send the generated desktop ZIP shown in that message to the developers.

          Keep dirigent-diagnostic.pdb with this exact executable. Dumps and PDBs
          from different builds cannot be mixed.
          "@ | Set-Content -Path (Join-Path $dist "README.txt") -Encoding utf8

      - name: Upload diagnostic kit
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIRIGENT_BUILD_NAME }}-windows-x86_64
          path: dist/${{ env.DIRIGENT_BUILD_NAME }}/*
          if-no-files-found: error
          retention-days: 30
