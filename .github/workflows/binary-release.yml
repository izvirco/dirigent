name: Binary builds

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LILEX_VERSION: "2.700"
  LILEX_SHA256: "34310edb4ba749f772d42b88e3eec4a6318527e75ceeaa96cfc556ee35366fbc"

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: blacksmith-2vcpu-windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create build name
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionMatch) {
            throw "Could not read the package version from Cargo.toml"
          }

          $version = $versionMatch.Matches[0].Groups[1].Value
          $timestamp = [DateTime]::UtcNow.ToString("yyyyMMdd_HHmm", [Globalization.CultureInfo]::InvariantCulture)
          $buildName = "dirigent_${version}_${timestamp}"

          "DIRIGENT_BUILD_NAME=$buildName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DIRIGENT_ASSET_NAME=$buildName.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DIRIGENT_ARTIFACT_NAME=$buildName-windows-x86_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building $buildName (UTC)"

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: useblacksmith/rust-cache@v3

      - name: Download Lilex
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "Lilex.zip"
          $destination = Join-Path $env:RUNNER_TEMP "Lilex"
          $url = "https://github.com/mishamyrt/Lilex/releases/download/$env:LILEX_VERSION/Lilex.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LILEX_SHA256) {
            throw "Lilex archive checksum mismatch: expected $env:LILEX_SHA256, got $actualHash"
          }

          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $fontDirectory = Join-Path $destination "ttf"
          "LILEX_FONT_DIR=$fontDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build bundled release executable
        run: cargo build --locked --release --features bundled-lilex

      - name: Prepare build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $executable = Join-Path "dist" $env:DIRIGENT_ASSET_NAME
          Copy-Item target/release/dirigent.exe $executable
          Copy-Item licenses/Lilex-OFL.txt dist/Lilex-OFL.txt

          $checksum = (Get-FileHash -Path $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $env:DIRIGENT_ASSET_NAME" | Set-Content -Path "$executable.sha256" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIRIGENT_ARTIFACT_NAME }}
          path: dist/*
          if-no-files-found: error

  build-arch-linux:
    name: Build Arch Linux executable
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container: archlinux:base-devel

    steps:
      - name: Install system dependencies
        run: |
          pacman --sync --refresh --sysupgrade --noconfirm
          pacman --sync --needed --noconfirm \
            curl \
            fontconfig \
            freetype2 \
            git \
            libxkbcommon \
            pkgconf \
            unzip \
            vulkan-icd-loader \
            wayland

      - name: Check out source
        uses: actions/checkout@v4

      - name: Create build name
        shell: bash
        run: |
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read the package version from Cargo.toml" >&2
            exit 1
          fi

          timestamp="$(date -u +%Y%m%d_%H%M)"
          build_name="dirigent_${version}_${timestamp}"

          echo "DIRIGENT_BUILD_NAME=$build_name" >> "$GITHUB_ENV"
          echo "DIRIGENT_ASSET_NAME=$build_name" >> "$GITHUB_ENV"
          echo "DIRIGENT_ARTIFACT_NAME=$build_name-arch-linux-x86_64" >> "$GITHUB_ENV"
          echo "Building $build_name (UTC)"

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: useblacksmith/rust-cache@v3

      - name: Download Lilex
        shell: bash
        run: |
          archive="$RUNNER_TEMP/Lilex.zip"
          destination="$RUNNER_TEMP/Lilex"
          url="https://github.com/mishamyrt/Lilex/releases/download/$LILEX_VERSION/Lilex.zip"

          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "$LILEX_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$destination"
          echo "LILEX_FONT_DIR=$destination/ttf" >> "$GITHUB_ENV"

      - name: Build bundled release executable
        run: cargo build --locked --release --features bundled-lilex

      - name: Prepare build artifacts
        shell: bash
        run: |
          mkdir -p dist
          executable="dist/$DIRIGENT_ASSET_NAME"
          cp target/release/dirigent "$executable"
          cp licenses/Lilex-OFL.txt dist/Lilex-OFL.txt
          (cd dist && sha256sum "$DIRIGENT_ASSET_NAME" > "$DIRIGENT_ASSET_NAME.sha256")

      - name: Upload Arch Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIRIGENT_ARTIFACT_NAME }}
          path: dist/*
          if-no-files-found: error
