name: Binary builds

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_channel:
        description: Publish this build
        type: choice
        options:
          - none
          - unstable
        default: none

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LILEX_VERSION: "2.700"
  LILEX_SHA256: "34310edb4ba749f772d42b88e3eec4a6318527e75ceeaa96cfc556ee35366fbc"

jobs:
  prepare:
    name: Prepare release identity
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      commit: ${{ steps.release.outputs.commit }}
      windows_file_name: ${{ steps.release.outputs.windows_file_name }}
      linux_file_name: ${{ steps.release.outputs.linux_file_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create release identity
        id: release
        shell: bash
        env:
          REQUESTED_CHANNEL: ${{ inputs.publish_channel || 'none' }}
        run: |
          package_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$package_version" ]]; then
            echo "Could not read the package version from Cargo.toml" >&2
            exit 1
          fi

          # Windows paths are case-insensitive. Canonicalize channel names for every platform.
          channel="$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C tr '[:upper:]' '[:lower:]' | LC_ALL=C tr -c 'a-z0-9._+-' '-')"
          version="$(date -u +%Y%m%d-%H%M%S)"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            # Stable is a virtual channel advanced only by immutable version tags.
            channel="stable"
            version="${GITHUB_REF_NAME#v}"
            publish=true
            if [[ "$version" != "$package_version" ]]; then
              echo "Tag version $version does not match Cargo version $package_version" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_CHANNEL" != "none" ]]; then
            channel="$REQUESTED_CHANNEL"
            publish=true
          elif [[ "$GITHUB_REF" == "refs/heads/unstable" || "$GITHUB_REF" == "refs/heads/unstable-next" ]]; then
            publish=true
          fi

          if [[ ! "$channel" =~ ^[a-z0-9][a-z0-9._+-]*$ || ${#channel} -gt 128 || "$channel" == *. ]]; then
            echo "Invalid channel name for an installation directory: $channel" >&2
            exit 1
          fi
          case "${channel%%.*}" in
            con|prn|aux|nul|com[1-9]|lpt[1-9]) echo "Reserved Windows channel name: $channel" >&2; exit 1 ;;
          esac
          if [[ "$channel" == "stable" && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "The stable channel is reserved for version tags" >&2
            exit 1
          fi

          if [[ "$channel" == "stable" ]]; then
            binary_name="dirigent"
          else
            binary_name="dirigent-$channel"
          fi
          windows_file_name="$binary_name-setup.exe"
          linux_file_name="$binary_name.tar.gz"

          {
            echo "channel=$channel"
            echo "version=$version"
            echo "publish=$publish"
            echo "commit=${GITHUB_SHA:0:8}"
            echo "windows_file_name=$windows_file_name"
            echo "linux_file_name=$linux_file_name"
          } >> "$GITHUB_OUTPUT"
          echo "Building $channel $version ($publish) as $binary_name"

  build-windows:
    name: Build Windows installer
    needs: prepare
    # runs-on: blacksmith-2vcpu-windows-2025
    runs-on: windows-latest
    env:
      DIRIGENT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DIRIGENT_UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      DIRIGENT_UPDATE_TARGET: x86_64-pc-windows-msvc
      DIRIGENT_COMMIT_ID: ${{ needs.prepare.outputs.commit }}
      DIRIGENT_WINDOWS_FILE_NAME: ${{ needs.prepare.outputs.windows_file_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: useblacksmith/rust-cache@v3

      - name: Download Lilex
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "Lilex.zip"
          $destination = Join-Path $env:RUNNER_TEMP "Lilex"
          $url = "https://github.com/mishamyrt/Lilex/releases/download/$env:LILEX_VERSION/Lilex.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LILEX_SHA256) {
            throw "Lilex archive checksum mismatch: expected $env:LILEX_SHA256, got $actualHash"
          }

          Expand-Archive -Path $archive -DestinationPath $destination -Force
          "LILEX_FONT_DIR=$(Join-Path $destination 'ttf')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test installation and launcher
        run: cargo test -p dirigent_launcher --locked

      - name: Build bundled desktop and launcher
        run: cargo build -p dirigent_desktop -p dirigent_launcher --locked --release --features bundled-lilex,self-update

      - name: Build per-user installer and updater payload
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "stage"
          $dist = Join-Path $PWD "dist"
          $versionDir = Join-Path $stage "versions/$env:DIRIGENT_UPDATE_CHANNEL-$env:DIRIGENT_RELEASE_VERSION"
          New-Item -ItemType Directory -Path $versionDir, $dist -Force | Out-Null
          Copy-Item target/release/dirigent.exe $stage
          Copy-Item target/release/dirigent_desktop.exe $versionDir
          Copy-Item target/release/dirigent_desktop.exe $dist
          @{ channel = $env:DIRIGENT_UPDATE_CHANNEL; version = $env:DIRIGENT_RELEASE_VERSION } |
            ConvertTo-Json | Set-Content (Join-Path $stage "current.json") -Encoding utf8NoBOM
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $binaryName = $env:DIRIGENT_WINDOWS_FILE_NAME -replace '-setup.exe$', ''
          & $iscc "/DChannel=$env:DIRIGENT_UPDATE_CHANNEL" "/DReleaseVersion=$env:DIRIGENT_RELEASE_VERSION" "/DBinaryName=$binaryName" "/DStageDir=$stage" "/DOutputDir=$dist" packaging/windows/dirigent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $dist -Filter *.exe | ForEach-Object {
            $checksum = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$checksum  $($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Test silent installation and uninstallation
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP "Dirigent installer test"
          $setup = Join-Path $PWD "dist/$env:DIRIGENT_WINDOWS_FILE_NAME"
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$install`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $selected = Get-Content (Join-Path $install 'current.json') -Raw | ConvertFrom-Json
          if ($selected.channel -ne $env:DIRIGENT_UPDATE_CHANNEL -or $selected.version -ne $env:DIRIGENT_RELEASE_VERSION) {
            throw 'Installer selected the wrong release'
          }
          if (-not (Test-Path (Join-Path $install 'dirigent.exe')) -or
              -not (Test-Path (Join-Path $install "versions/$($selected.channel)-$($selected.version)/dirigent_desktop.exe"))) {
            throw 'Installer did not create the expected layout'
          }
          $verbs = @{
            "HKCU:\Software\Classes\Directory\shell\Dirigent-$env:DIRIGENT_UPDATE_CHANNEL" = '%1'
            "HKCU:\Software\Classes\Directory\Background\shell\Dirigent-$env:DIRIGENT_UPDATE_CHANNEL" = '%V'
          }
          foreach ($key in $verbs.Keys) {
            $command = (Get-Item "$key\command").GetValue('')
            $expected = '"{0}\dirigent.exe" --open-project "{1}\."' -f $install, $verbs[$key]
            if ($command -ne $expected) { throw "Incorrect Explorer command: $command" }
          }
          $process = Start-Process (Join-Path $install 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited with $($process.ExitCode)" }
          if (Test-Path (Join-Path $install 'current.json')) { throw 'Uninstaller left the installation selection behind' }
          foreach ($key in $verbs.Keys) {
            if (Test-Path $key) { throw "Uninstaller left the Explorer entry behind: $key" }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirigent-windows-x86_64
          path: dist/*
          if-no-files-found: error

  build-arch-linux:
    name: Build Arch Linux installation archive
    needs: prepare
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container: archlinux:base-devel
    env:
      DIRIGENT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DIRIGENT_UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      DIRIGENT_UPDATE_TARGET: x86_64-arch-linux
      DIRIGENT_COMMIT_ID: ${{ needs.prepare.outputs.commit }}
      DIRIGENT_LINUX_FILE_NAME: ${{ needs.prepare.outputs.linux_file_name }}

    steps:
      - name: Install system dependencies
        run: |
          pacman --sync --refresh --sysupgrade --noconfirm
          pacman --sync --needed --noconfirm \
            curl \
            fontconfig \
            freetype2 \
            git \
            libxkbcommon \
            pkgconf \
            unzip \
            vulkan-icd-loader \
            wayland

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: useblacksmith/rust-cache@v3

      - name: Download Lilex
        shell: bash
        run: |
          archive="$RUNNER_TEMP/Lilex.zip"
          destination="$RUNNER_TEMP/Lilex"
          url="https://github.com/mishamyrt/Lilex/releases/download/$LILEX_VERSION/Lilex.zip"

          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "$LILEX_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$destination"
          echo "LILEX_FONT_DIR=$destination/ttf" >> "$GITHUB_ENV"

      - name: Test installation and launcher
        run: cargo test -p dirigent_launcher --locked

      - name: Build bundled desktop and launcher
        run: cargo build -p dirigent_desktop -p dirigent_launcher --locked --release --features bundled-lilex,self-update

      - name: Prepare installation archive and updater payload
        shell: bash
        run: |
          binary_name="${DIRIGENT_LINUX_FILE_NAME%.tar.gz}"
          root="stage/$binary_name"
          version_dir="$root/versions/$DIRIGENT_UPDATE_CHANNEL-$DIRIGENT_RELEASE_VERSION"
          mkdir -p dist "$version_dir"
          cp target/release/dirigent "$root/dirigent"
          cp target/release/dirigent_desktop "$version_dir/"
          cp target/release/dirigent_desktop dist/
          printf '{"channel":"%s","version":"%s"}\n' "$DIRIGENT_UPDATE_CHANNEL" "$DIRIGENT_RELEASE_VERSION" > "$root/current.json"
          tar -czf "dist/$DIRIGENT_LINUX_FILE_NAME" -C stage "$binary_name"
          (cd dist && sha256sum "$DIRIGENT_LINUX_FILE_NAME" dirigent_desktop > checksums.sha256)

      - name: Upload Arch Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirigent-arch-linux-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.prepare.outputs.channel }} ${{ needs.prepare.outputs.version }}
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - build-windows
      - build-arch-linux
    runs-on: ubuntu-24.04
    env:
      DIRIGENT_API_URL: ${{ vars.DIRIGENT_API_URL || 'https://dirigent.sebba.dev' }}
      DIRIGENT_PUBLISH_TOKEN: ${{ secrets.DIRIGENT_PUBLISH_TOKEN }}
      DIRIGENT_WINDOWS_FILE_NAME: ${{ needs.prepare.outputs.windows_file_name }}
      DIRIGENT_LINUX_FILE_NAME: ${{ needs.prepare.outputs.linux_file_name }}

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dirigent-windows-x86_64
          path: dist/windows

      - name: Download Arch Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dirigent-arch-linux-x86_64
          path: dist/arch-linux

      - name: Build publishing manifest
        shell: bash
        run: |
          jq -n \
            --arg version '${{ needs.prepare.outputs.version }}' \
            --arg commit '${{ needs.prepare.outputs.commit }}' \
            --arg windows_file_name "$DIRIGENT_WINDOWS_FILE_NAME" \
            --arg linux_file_name "$DIRIGENT_LINUX_FILE_NAME" \
            '{
              version: $version,
              commit: $commit,
              artifacts: [
                { target: "x86_64-pc-windows-msvc", kind: "installer", file_name: $windows_file_name },
                { target: "x86_64-pc-windows-msvc", kind: "application", file_name: "dirigent_desktop.exe" },
                { target: "x86_64-arch-linux", kind: "installer", file_name: $linux_file_name },
                { target: "x86_64-arch-linux", kind: "application", file_name: "dirigent_desktop" }
              ]
            }' > manifest.json

      - name: Publish release
        shell: bash
        run: |
          curl --fail-with-body --show-error \
            -H "Authorization: Bearer $DIRIGENT_PUBLISH_TOKEN" \
            -F 'manifest=@manifest.json;type=application/json' \
            -F "x86_64-pc-windows-msvc-installer=@dist/windows/$DIRIGENT_WINDOWS_FILE_NAME;filename=$DIRIGENT_WINDOWS_FILE_NAME" \
            -F 'x86_64-pc-windows-msvc-application=@dist/windows/dirigent_desktop.exe;filename=dirigent_desktop.exe' \
            -F "x86_64-arch-linux-installer=@dist/arch-linux/$DIRIGENT_LINUX_FILE_NAME;filename=$DIRIGENT_LINUX_FILE_NAME" \
            -F 'x86_64-arch-linux-application=@dist/arch-linux/dirigent_desktop;filename=dirigent_desktop' \
            "$DIRIGENT_API_URL/api/v0/version/${{ needs.prepare.outputs.channel }}"
