name: Binary builds

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_channel:
        description: Publish this build
        type: choice
        options:
          - none
          - unstable
        default: none

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LILEX_VERSION: "2.700"
  LILEX_SHA256: "34310edb4ba749f772d42b88e3eec4a6318527e75ceeaa96cfc556ee35366fbc"

jobs:
  prepare:
    name: Prepare release identity
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      commit: ${{ steps.release.outputs.commit }}
      windows_file_name: ${{ steps.release.outputs.windows_file_name }}
      linux_file_name: ${{ steps.release.outputs.linux_file_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create release identity
        id: release
        shell: bash
        env:
          REQUESTED_CHANNEL: ${{ inputs.publish_channel || 'none' }}
        run: |
          package_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$package_version" ]]; then
            echo "Could not read the package version from Cargo.toml" >&2
            exit 1
          fi

          # Channels are used in update URLs and binary file names, so keep them to the
          # component characters accepted by the version server.
          channel="$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C tr -c 'A-Za-z0-9._+-' '-')"
          version="$(date -u +%Y%m%d-%H%M%S)"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            # Stable is a virtual channel advanced only by immutable version tags.
            channel="stable"
            version="${GITHUB_REF_NAME#v}"
            publish=true
            if [[ "$version" != "$package_version" ]]; then
              echo "Tag version $version does not match Cargo version $package_version" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_CHANNEL" != "none" ]]; then
            channel="$REQUESTED_CHANNEL"
            publish=true
          elif [[ "$GITHUB_REF" == "refs/heads/unstable" ]]; then
            channel="unstable"
            publish=true
          fi

          if [[ "$channel" == "stable" ]]; then
            binary_name="dirigent"
          else
            binary_name="dirigent-$channel"
          fi
          windows_file_name="$binary_name.exe"
          linux_file_name="$binary_name"

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "windows_file_name=$windows_file_name" >> "$GITHUB_OUTPUT"
          echo "linux_file_name=$linux_file_name" >> "$GITHUB_OUTPUT"
          echo "Building $channel $version ($publish) as $binary_name"

  build-windows:
    name: Build Windows executable
    needs: prepare
    runs-on: blacksmith-2vcpu-windows-2025
    env:
      DIRIGENT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DIRIGENT_UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      DIRIGENT_UPDATE_TARGET: x86_64-pc-windows-msvc
      DIRIGENT_COMMIT_ID: ${{ needs.prepare.outputs.commit }}
      DIRIGENT_WINDOWS_FILE_NAME: ${{ needs.prepare.outputs.windows_file_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: useblacksmith/rust-cache@v3

      - name: Download Lilex
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "Lilex.zip"
          $destination = Join-Path $env:RUNNER_TEMP "Lilex"
          $url = "https://github.com/mishamyrt/Lilex/releases/download/$env:LILEX_VERSION/Lilex.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LILEX_SHA256) {
            throw "Lilex archive checksum mismatch: expected $env:LILEX_SHA256, got $actualHash"
          }

          Expand-Archive -Path $archive -DestinationPath $destination -Force
          "LILEX_FONT_DIR=$(Join-Path $destination 'ttf')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build bundled release executable
        run: cargo build -p dirigent_desktop --locked --release --features bundled-lilex

      - name: Prepare build artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $artifact = Join-Path dist $env:DIRIGENT_WINDOWS_FILE_NAME
          Copy-Item target/release/dirigent.exe $artifact
          $checksum = (Get-FileHash -Path $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $env:DIRIGENT_WINDOWS_FILE_NAME" | Set-Content -Path "$artifact.sha256" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirigent-windows-x86_64
          path: dist/*
          if-no-files-found: error

  build-arch-linux:
    name: Build Arch Linux executable
    needs: prepare
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container: archlinux:base-devel
    env:
      DIRIGENT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DIRIGENT_UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      DIRIGENT_UPDATE_TARGET: x86_64-arch-linux
      DIRIGENT_COMMIT_ID: ${{ needs.prepare.outputs.commit }}
      DIRIGENT_LINUX_FILE_NAME: ${{ needs.prepare.outputs.linux_file_name }}

    steps:
      - name: Install system dependencies
        run: |
          pacman --sync --refresh --sysupgrade --noconfirm
          pacman --sync --needed --noconfirm \
            curl \
            fontconfig \
            freetype2 \
            git \
            libxkbcommon \
            pkgconf \
            unzip \
            vulkan-icd-loader \
            wayland

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: useblacksmith/rust-cache@v3

      - name: Download Lilex
        shell: bash
        run: |
          archive="$RUNNER_TEMP/Lilex.zip"
          destination="$RUNNER_TEMP/Lilex"
          url="https://github.com/mishamyrt/Lilex/releases/download/$LILEX_VERSION/Lilex.zip"

          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "$LILEX_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$destination"
          echo "LILEX_FONT_DIR=$destination/ttf" >> "$GITHUB_ENV"

      - name: Build bundled release executable
        run: cargo build -p dirigent_desktop --locked --release --features bundled-lilex

      - name: Prepare build artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/dirigent "dist/$DIRIGENT_LINUX_FILE_NAME"
          (cd dist && sha256sum "$DIRIGENT_LINUX_FILE_NAME" > "$DIRIGENT_LINUX_FILE_NAME.sha256")

      - name: Upload Arch Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirigent-arch-linux-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.prepare.outputs.channel }} ${{ needs.prepare.outputs.version }}
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - build-windows
      - build-arch-linux
    runs-on: ubuntu-24.04
    env:
      DIRIGENT_API_URL: ${{ vars.DIRIGENT_API_URL || 'https://dirigent.sebba.dev' }}
      DIRIGENT_PUBLISH_TOKEN: ${{ secrets.DIRIGENT_PUBLISH_TOKEN }}
      DIRIGENT_WINDOWS_FILE_NAME: ${{ needs.prepare.outputs.windows_file_name }}
      DIRIGENT_LINUX_FILE_NAME: ${{ needs.prepare.outputs.linux_file_name }}

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dirigent-windows-x86_64
          path: dist/windows

      - name: Download Arch Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dirigent-arch-linux-x86_64
          path: dist/arch-linux

      - name: Build publishing manifest
        shell: bash
        run: |
          jq -n \
            --arg version '${{ needs.prepare.outputs.version }}' \
            --arg commit '${{ needs.prepare.outputs.commit }}' \
            --arg windows_file_name "$DIRIGENT_WINDOWS_FILE_NAME" \
            --arg linux_file_name "$DIRIGENT_LINUX_FILE_NAME" \
            '{
              version: $version,
              commit: $commit,
              artifacts: [
                { target: "x86_64-pc-windows-msvc", file_name: $windows_file_name },
                { target: "x86_64-arch-linux", file_name: $linux_file_name }
              ]
            }' > manifest.json

      - name: Publish release
        shell: bash
        run: |
          curl --fail-with-body --show-error \
            -H "Authorization: Bearer $DIRIGENT_PUBLISH_TOKEN" \
            -F 'manifest=@manifest.json;type=application/json' \
            -F "x86_64-pc-windows-msvc=@dist/windows/$DIRIGENT_WINDOWS_FILE_NAME;filename=$DIRIGENT_WINDOWS_FILE_NAME" \
            -F "x86_64-arch-linux=@dist/arch-linux/$DIRIGENT_LINUX_FILE_NAME;filename=$DIRIGENT_LINUX_FILE_NAME" \
            "$DIRIGENT_API_URL/api/v0/version/${{ needs.prepare.outputs.channel }}"
