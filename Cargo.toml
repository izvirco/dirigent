[workspace]
resolver = "3"
members = [
  "dirigent_agent",
  "dirigent_api",
  "dirigent_auth",
  "dirigent_cli",
  "dirigent_desktop",
  "dirigent_protocol",
  "dirigent_service",
]

[workspace.package]
version = "0.0.11"
edition = "2024"

[workspace.dependencies]
dirigent_agent = { path = "dirigent_agent" }
dirigent_protocol = { path = "dirigent_protocol" }
dirigent_auth = { path = "dirigent_auth" }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a tool call's input goes back to the model with its keys as the model wrote
# them. Sorted keys are a prompt the provider hasn't cached.
# (gpui turns it on for the desktop anyway; the service on a remote host is built without gpui.)
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
anyhow = "1"
tracing = "0.1"
# HTTP for the update check and `dirigent_api` (rustls; no system TLS to link against).
ureq = { version = "3", default-features = false, features = ["rustls"] }
semver = "1"

# Shrinking a pasted screenshot (`dirigent_desktop` `images.rs`) takes seconds unoptimized:
# keep debug builds (the UI harness, tests) close to release there.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
