[package]
name = "dirigent"
version = "0.0.0"
edition = "2024"

[features]
bundled-lilex = []

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "e191dd00c7e36cfcbbdccad2babca096067777c0", default-features = false, features = ["font-kit", "wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e191dd00c7e36cfcbbdccad2babca096067777c0", features = ["font-kit", "wayland"] }
async-channel = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.38", features = ["bundled"] }
fff-search = "=0.10.1"
pulldown-cmark = { version = "0.13", default-features = false }
notify = "8"
toml = "0.9"
fastrand = "2.5"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
embed-resource = "3"

[patch.crates-io]
# Includes the unreleased fix for Rust's `pub_use_of_private_extern_crate` warning.
proc-macro-error2 = { git = "https://github.com/fgardt/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }
