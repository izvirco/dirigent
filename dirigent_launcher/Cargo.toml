[package]
name = "dirigent_launcher"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dirigent"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
interprocess = "2.4"

[target.'cfg(windows)'.dependencies]
interprocess = "2.4"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[build-dependencies]
embed-resource = "3"
