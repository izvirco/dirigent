[package]
name = "dirigent_service"
version.workspace = true
edition.workspace = true

[dependencies]
dirigent_protocol.workspace = true
dirigent_auth.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
toml = "0.8"
# `forge.rs`: the browser's return to the loopback port.
form_urlencoded = "1"
# `auth.rs`: API keys.
getrandom = "0.4"
# `logging.rs`: the log setup both binaries share.
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `proxy.rs`: the CLIProxyAPI management API.
ureq.workspace = true

# `server.rs`: `TCP_NOTSENT_LOWAT` on connections; `tunnel.rs`: `PR_SET_PDEATHSIG`.
[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
dirigent_auth = { workspace = true, features = ["testing"] }
