[package]
name = "dirigent_service"
version.workspace = true
edition.workspace = true

# The command line (`dirigent service` is the standalone service, `dirigent pi` the bundled
# pi, `dirigent [dir]` starts the desktop); the desktop embeds the lib.
[[bin]]
name = "dirigent"
path = "src/main.rs"

[dependencies]
dirigent_protocol.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
toml = "0.8"
# `logging.rs`: the log setup both binaries share.
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# `server.rs`: `TCP_NOTSENT_LOWAT` on connections.
[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tempfile = "3"
